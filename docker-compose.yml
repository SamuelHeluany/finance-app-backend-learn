services:
    postgres:
        image: postgres:18
        container_name: finance-app-postgres-compose
        environment:
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
            POSTGRES_USER: ${POSTGRES_USER}
            POSTGRES_DB: ${POSTGRES_DB}
        ports:
            - '5432:5432'
        volumes_from:
            - container:finance-app-postgres:rw
